<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No remote origins. SPEC invariant 2: everything works offline, and the
      seven existing books pulling MathJax from a CDN is the defect this
      replaces. MathJax, pdf.js and Tesseract are all vendored under public/.

      `blob:` is allowed for workers because Tesseract starts its own from a
      blob it builds at runtime, and `'wasm-unsafe-eval'` because its engine is
      WebAssembly. Both widen the policy, and the trade is worth naming: the
      blob is assembled by a script that came from `'self'`, the WebAssembly is
      a file in this bundle, and no outside origin can reach the page to plant
      either. Nothing here relaxes `default-src`, so the page still cannot talk
      to the network at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:"
    />
    <title>Lectern</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-head">
          <h1>Lectern</h1>
          <button id="export-index" type="button" title="Write INDEX.md for the whole library">Index</button>
          <button id="rescan" type="button" title="Re-scan the library">Rescan</button>
        </header>
        <nav id="books"></nav>
        <div id="flags"></div>
        <section id="bookmarks"></section>
        <footer id="library-meta"></footer>
      </aside>

      <main id="reader">
        <div id="content">
          <div class="placeholder">
            <p>Choose a chapter.</p>
          </div>
        </div>
        <div id="scan-progress" hidden></div>
        <div id="player">
          <button id="play" type="button" title="Read aloud (Space)">▶ Read aloud</button>
          <button id="prev-block" type="button" title="Previous sentence">↑</button>
          <button id="next-block" type="button" title="Next sentence">↓</button>
          <button id="prev-section" type="button" title="Previous section">⇤</button>
          <button id="next-section" type="button" title="Next section">⇥</button>
          <span id="speech-position"></span>
          <label id="rate-control">
            Speed
            <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1" />
            <span id="rate-value">1.0×</span>
          </label>
          <select id="voice" title="Voice"></select>
        </div>
        <nav id="chapter-nav"></nav>
        <div id="flag-bar">
          <span id="flag-target"></span>
          <button data-flag="confusing" type="button">Confusing</button>
          <button data-flag="wrong" type="button">Looks wrong</button>
          <button data-flag="thin" type="button">Too thin</button>
          <button data-flag="good" type="button">Worked well</button>
          <input id="flag-note" type="text" placeholder="Note (optional)" />
          <button id="flag-cancel" type="button">Cancel</button>
        </div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
