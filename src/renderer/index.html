<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No remote origins. SPEC invariant 2: everything works offline, and the
      seven existing books pulling MathJax from a CDN is the defect this
      replaces. MathJax, pdf.js and Tesseract are all vendored under public/.

      `blob:` is allowed for workers because Tesseract starts its own from a
      blob it builds at runtime, and `'wasm-unsafe-eval'` because its engine is
      WebAssembly. Both widen the policy, and the trade is worth naming: the
      blob is assembled by a script that came from `'self'`, the WebAssembly is
      a file in this bundle, and no outside origin can reach the page to plant
      either. Nothing here relaxes `default-src`, so the page still cannot
      fetch, load a script, or take a stylesheet from the network.

      `book:` is a chapter's own figures and media, served out of its book
      folder by the main process and nothing else.

      `frame-src https:` is the one remote origin, and it is deliberate:
      invariant 2's exception for embedded media. A frame is a document of its
      own, so it cannot restyle a chapter or reach the page; every frame a
      chapter embeds is sandboxed on the way in (see `@shared/assets`); and an
      embed that cannot load fails inside its frame while the chapter around it
      reads on. `'self'` is restated because declaring `frame-src` at all stops
      it inheriting from `default-src` -- leaving it out would have broken
      every local embed while enabling the remote ones.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' book: https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: book:; media-src 'self' blob: book:; font-src 'self'; connect-src 'self' blob: data:"
    />
    <title>Lectern</title>
  </head>
  <body>
    <div id="drop-overlay"><span>Drop to add to the library</span></div>
    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-head">
          <h1>Lectern</h1>
          <button id="collapse" type="button" title="Hide the sidebar">‹</button>
          <button id="home" type="button" title="Back to the shelf">Library</button>
          <button id="settings" type="button" title="Settings">Settings</button>
        </header>
        <nav id="books"></nav>
        <div id="flags"></div>
        <section id="bookmarks"></section>
        <footer id="library-meta"></footer>
      </aside>

      <main id="reader">
        <section id="find-bar" hidden aria-label="Find in this book">
          <div class="find-row">
            <input id="find-input" type="search" placeholder="Find in this book" autocomplete="off" spellcheck="false" />
            <button id="find-close" type="button" title="Close (Esc)">×</button>
          </div>
          <p id="find-status" aria-live="polite"></p>
          <div id="find-results"></div>
        </section>
        <div id="content">
          <div class="placeholder">
            <p>Choose a chapter.</p>
          </div>
        </div>
        <div id="scan-progress" hidden></div>
        <div id="prepare-progress" hidden></div>
        <div id="player">
          <button id="play" type="button" title="Read aloud (Space, or double-click a paragraph)">▶ Read aloud</button>
          <button id="prev-block" type="button" title="Previous sentence">↑</button>
          <button id="next-block" type="button" title="Next sentence">↓</button>
          <button id="prev-section" type="button" title="Previous section">⇤</button>
          <button id="next-section" type="button" title="Next section">⇥</button>
          <span id="speech-position"></span>
          <label id="rate-control">
            Speed
            <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1" />
            <span id="rate-value">1.0×</span>
          </label>
          <select id="voice" title="Voice"></select>
          <label id="shape-row" hidden>
            Expression
            <input id="expressive" type="range" min="0" max="1" step="0.05" value="0.6" />
          </label>
          <span id="voice-hint" hidden></span>
        </div>
        <nav id="chapter-nav"></nav>
        <div id="flag-bar">
          <span id="flag-target"></span>
          <button data-flag="confusing" type="button">Confusing</button>
          <button data-flag="wrong" type="button">Looks wrong</button>
          <button data-flag="thin" type="button">Too thin</button>
          <button data-flag="lost" type="button">Can&#39;t find it</button>
          <button data-flag="good" type="button">Worked well</button>
          <input id="flag-note" type="text" placeholder="Note (optional)" />
          <button id="flag-cancel" type="button">Cancel</button>
        </div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
