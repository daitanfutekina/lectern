<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No remote origins. SPEC invariant 2: everything works offline, and the
      seven existing books pulling MathJax from a CDN is the defect this
      replaces. MathJax is vendored under public/.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Lectern</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-head">
          <h1>Lectern</h1>
          <button id="rescan" type="button" title="Re-scan the library">Rescan</button>
        </header>
        <nav id="books"></nav>
        <section id="bookmarks"></section>
        <footer id="library-meta"></footer>
      </aside>

      <main id="reader">
        <div id="content">
          <div class="placeholder">
            <p>Choose a chapter.</p>
          </div>
        </div>
        <div id="player">
          <button id="play" type="button" title="Read aloud (Space)">▶ Read aloud</button>
          <button id="prev-block" type="button" title="Previous sentence">↑</button>
          <button id="next-block" type="button" title="Next sentence">↓</button>
          <button id="prev-section" type="button" title="Previous section">⇤</button>
          <button id="next-section" type="button" title="Next section">⇥</button>
          <span id="speech-position"></span>
          <label id="rate-control">
            Speed
            <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1" />
            <span id="rate-value">1.0×</span>
          </label>
          <select id="voice" title="Voice"></select>
        </div>
        <nav id="chapter-nav"></nav>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
